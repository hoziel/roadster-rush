<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Revision 2 review</title><style>*{box-sizing:border-box}body{margin:0;background:#241d32;color:#fff0d8;font:16px system-ui}main{max-width:1280px;margin:auto;padding:26px}h1{font-size:28px;margin:0}p{color:#cec2d9;line-height:1.5}a{color:#edb556}nav{display:flex;gap:8px;margin:18px 0}button{font:inherit;background:#493752;color:#fff0d8;border:0;border-radius:9px;padding:10px 16px;cursor:pointer}button[aria-pressed=true]{background:#986247}.verdict{padding:15px;background:#493944;border-left:4px solid #edb556;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.overview{grid-template-columns:repeat(2,1fr)}figure{margin:0;background:#372c45;border-radius:12px;overflow:hidden}img{display:block;width:100%}figcaption{padding:10px;font-size:14px}.wide{grid-column:1/-1}.overview img{height:380px;object-fit:contain}.overview .wide img{height:auto}#copy{margin:15px 0}</style></head><body><main><h1>Driver models · Revision 2</h1><p>Detailed native studies. <a href="index.html">Interactive preview</a></p><div class="verdict">More detailed identity cues and measured seated fit. Still below the requested perfect-likeness bar; keep the illustrated heroes pending review.</div><nav><button data-id="overview" aria-pressed="true">Overview</button><button data-id="nevo">Nevo</button><button data-id="ori">Ori</button><button data-id="shiri">Shiri</button><button data-id="ofir">Ofir</button></nav><p id="copy"></p><div id="grid" class="grid"></div></main><script>
function show(id){document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));const overview=id==='overview',grid=document.querySelector('#grid');grid.className='grid'+(overview?' overview':'');document.querySelector('#copy').innerHTML=overview?'Seated scales: Nevo 74%, Ori 72%, Shiri/Ofir 62%. The canopy remains opaque. See notes.md for measured fit and likeness limits.':'Front · 3/4 · side · back · face · seated. <a href="comparison.html?driver='+id+'">Compare with the supplied artwork</a>.';const images=overview?[['lineup','Ofir, Shiri, Ori, Nevo · standing heights','wide'],['nevo-door','Nevo beside the open roadster',''],['nevo-cutaway','74% scale · canopy hidden to inspect wheel reach',''],['nevo-seat-full','100% standing scale diagnostic · does not fit',''],['nevo-chase','74% scale · original canopy conceals the driver','']]:['front','three-quarter','side','back','face','seated'].map(v=>[id+'-'+v,v,'']);grid.innerHTML=images.map(([file,label,cls])=>'<figure class="'+cls+'"><img src="'+file+'.png" alt="'+label+'"><figcaption>'+label+'</figcaption></figure>').join('');}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.id));show('overview');
</script></body></html>
