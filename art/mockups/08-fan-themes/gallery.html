<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fan themes · review gallery</title><style>@font-face{font-family:Fredoka;src:url('../../../src/ui/fonts/Fredoka-Variable.ttf')}*{box-sizing:border-box}body{margin:0;padding:28px;background:#fff1dc;color:#282538;font:16px Fredoka,system-ui}h1{margin:0;font-size:32px}p{max-width:960px;line-height:1.4}button,a{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:#282538;color:#fff1dc;text-decoration:none}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button[aria-pressed=true]{background:#2466d4}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}figure{margin:0;background:white;border-radius:12px;overflow:hidden}img{width:100%;display:block}figcaption{padding:10px;text-transform:capitalize}main.ads{grid-template-columns:repeat(2,minmax(0,1fr))}main.chase{grid-template-columns:repeat(3,minmax(0,1fr))}main.lineup{grid-template-columns:1fr;max-width:1100px}@media(max-width:700px){main,main.ads{grid-template-columns:repeat(2,minmax(0,1fr))}main.chase{grid-template-columns:1fr}}</style><h1>Fan themes · Revision 1</h1><p>Native Three.js studies: basketball, karate, volleyball and gymnastics. Original anonymous athletes, eight canvas posters and two court props. Review the silhouettes and poses before game integration.</p><nav id="tabs"></nav><p id="caption"></p><main></main><script>
const groups={
Lineup:['nevo-lineup'],
Posters:['nevo-ad-1','nevo-ad-2','nevo-ad-3','nevo-ad-4','ori-ad-1','ori-ad-2','ori-ad-3','ori-ad-4'],
Basketball:['shoot-load','shoot-release','shoot-follow-through','shoot-recover','dribble-high','dribble-low'],
Karate:['karate-guard','karate-chamber','karate-extension','karate-punch'],
Volleyball:['bump-ready','bump-contact'],
Cartwheel:['cartwheel-prepare','cartwheel-first-hand','cartwheel-inverted','cartwheel-second-hand','cartwheel-land'],
Turnarounds:['shoot-load-front','shoot-load-side','shoot-load-back','karate-guard-front','karate-guard-side','karate-guard-back','bump-ready-front','bump-ready-side','bump-ready-back','cartwheel-prepare-front','cartwheel-prepare-side','cartwheel-prepare-back'],
Props:['hoop-three-quarter','hoop-front','hoop-side','hoop-back','net-three-quarter','net-front','net-side','net-back'],
Staging:['nevo-staged','ori-staged'],
Chase:['nevo-start','nevo-roadside','nevo-far','ori-start','ori-roadside','ori-far']};
function show(key){document.querySelector('main').className=key==='Posters'?'ads':key==='Chase'||key==='Staging'?'chase':key==='Lineup'?'lineup':'';document.querySelector('main').replaceChildren(...groups[key].map(file=>{const f=document.createElement('figure'),i=document.createElement('img'),c=document.createElement('figcaption');i.src=file+'.png';i.alt=file.replaceAll('-',' ');c.textContent=i.alt;f.append(i,c);return f;}));document.querySelector('#caption').textContent=key==='Staging'?'Proposed placement: board at 40 m, athletes at 20 m on the shoulder. Separate anchors keep the activity in the portrait camera instead of letting the billboard position crop it.':key==='Chase'?'540 × 1170 · 62° game camera. Start-line staging is at 30 m. Roadside = 20 m, far = 40 m longitudinal offset. At 20 m, current roadside placement is cropped: retain the 40 m reading window or move the activity inward during integration. These are staging studies, without the production HUD/city.':key==='Posters'?'768 × 384 · all eight optimized PNGs total 126,440 bytes. Canvas callbacks are the source; no image download is needed in the game.':key==='Lineup'?'1,490 triangles per complete player, plus a 384-triangle ball. Five instanced body batches and one ball batch. Themed cheer poses demonstrate crowd reuse.':'Actual native renders. Each key pose is available in the interactive preview.';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===key)));}
for(const key of Object.keys(groups)){const b=document.createElement('button');b.textContent=key;b.onclick=()=>show(key);document.querySelector('nav').append(b);}const a=document.createElement('a');a.href='./';a.textContent='Interactive preview';document.querySelector('nav').append(a);show('Lineup');
</script></html>
