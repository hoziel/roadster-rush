<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Downtown Austin · art review</title><style>@font-face{font-family:Fredoka;src:url('../../../src/ui/fonts/Fredoka-Variable.ttf')}*{box-sizing:border-box}body{margin:0;padding:28px;background:#241831;color:#fff0d8;font:16px Fredoka,system-ui}h1{margin:0;font-size:32px}p{max-width:1100px;line-height:1.4;color:#d9c8db}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,a{font:inherit;background:#5d3c70;color:#fff0d8;border:0;border-radius:10px;padding:10px 15px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#b66065}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}figure{margin:0;border-radius:12px;overflow:hidden;background:#3c294a}img{width:100%;display:block}figcaption{padding:9px;font-size:14px;text-transform:capitalize}main.street{grid-template-columns:repeat(3,minmax(0,1fr))}main.row{grid-template-columns:1fr}main.row img{max-height:600px;object-fit:contain}@media(max-width:700px){main{grid-template-columns:repeat(2,minmax(0,1fr))}main.street{grid-template-columns:1fr}}</style><h1>Downtown Austin · Revision 1</h1><p>Original native kit: six historic fronts, four skyline towers, six street props and a Capitol vista. One merged mesh/material per piece. All art is built from code, without textures or downloaded models.</p><nav></nav><p id="caption"></p><main></main><script>
const fronts=['brick-arc','limestone-hall','teal-corner','rose-bay','gold-market','plum-music'],towers=['crown-tower','slim-tower','stack-tower','blue-tower','capitol-vista'],props=['live-oak','moonlight-tower','texas-flag','pedicab','string-lights','postcard-mural'];const views=ids=>ids.flatMap(id=>['three-quarter','front','side','back'].map(v=>id+'-'+v));const groups={Street:['current-game','congress-sunset','congress-night'],Fronts:views(fronts),Towers:views(towers),Props:views(props),Row:['historic-row-sunset','historic-row-night']};
function show(key){const main=document.querySelector('main');main.className=key==='Street'?'street':key==='Row'?'row':'';main.replaceChildren(...groups[key].map(name=>{const f=document.createElement('figure'),i=document.createElement('img'),c=document.createElement('figcaption');i.src=name+'.png';i.alt=name.replaceAll('-',' ');c.textContent=name==='current-game'?'Current game clip · supplied baseline':i.alt;f.append(i,c);return f;}));document.querySelector('#caption').textContent=key==='Street'?'Left: supplied downtown game clip. Center/right: isolated native art study, with the game’s 62° chase camera. This is a kit/staging comparison, not an integrated game update. The study omits gameplay traffic and HUD.':key==='Row'?'Front elevation of six original storefronts. Invented names, simple block lettering, arched windows, stone cornices and striped awnings. Night uses the emissive vertex channel.':'3/4 · Front · Side · Back. Models face +Z and stand on y=0. Shop backs are deliberately simple. Towers/props are authored stylizations, not exact architectural replicas.';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===key)));}
for(const key of Object.keys(groups)){const b=document.createElement('button');b.textContent=key;b.onclick=()=>show(key);document.querySelector('nav').append(b);}const a=document.createElement('a');a.href='./';a.textContent='Interactive preview';document.querySelector('nav').append(a);show('Street');
</script></html>
